    modal({ title: '✨ ' + E(title), html: (imgs ? '<div class="row" style="justify-content:center">' + imgs + '</div>' : '') + '<p>' + E(text) + '</p>' + (reward ? '<p><b>' + E(reward) + '</b></p>' : ''), buttons: [{ label: 'Merveilleux', primary: true }] });
  }
  function decorMenu(d) {
    const def = G.D.decorations[d.type]; const refund = Math.round(def.cost * 0.5);
    modal({ title: def.name, html: '<p class="muted">' + E(def.desc) + '</p>', buttons: [{ label: 'Fermer' }, { label: 'Retirer (+' + refund + ' 🪙)', cls: 'warn', onClick: () => { const i = G.state.decor.indexOf(d); if (i >= 0) { G.state.decor.splice(i, 1); G.Game.addCoins(refund); G.State.save(true); toast('Décoration retirée.', '🧹'); } } }] });
  }
  function placingBanner(type) {
    const b = $('#placing');
    if (!type) { b.classList.add('hidden'); return; }
    b.innerHTML = '<span>Touchez l\'île pour placer : <b>' + E(G.D.decorations[type].name) + '</b> (' + G.D.decorations[type].cost + ' 🪙)</span><button id="stopPlace">Terminer</button>';
    b.classList.remove('hidden'); $('#stopPlace').onclick = () => G.Home.stopPlacing();
  }
  function journal() {
    const items = G.state.log.map(l => { const d = new Date(l.t); return '<div class="list-item"><span style="font-size:20px">' + l.icon + '</span><div class="grow small">' + E(l.text) + '<div class="muted">' + d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '</div></div></div>'; }).join('') || '<p class="muted">Rien pour le moment.</p>';
    modal({ title: '📜 Journal des événements', html: items, wide: true });
  }

  /* ---------- Exploration : dialogues ---------- */
  function npcDialog(id) {
    const d = G.D.characters[id], M = G.Sys.Missions;
    const first = G.Sys.Chars.meet(id);
    const dlg = M.dialogue(id);
    let extra = '';
    const buttons = [];
    if (dlg.mode === 'offer' || dlg.mode === 'waiting' || dlg.mode === 'turnin') {
      const m = M.M(dlg.id);
      extra = '<div class="card"><h3>📜 ' + E(m.title) + (m.main ? ' <span class="tag gold">Principale</span>' : ' <span class="tag">Secondaire</span>') + '</h3>' + objectivesHtml(dlg.id) + '<div class="small muted">Récompense : ' + rewardText(m.reward) + '</div></div>';
    }
    if (dlg.mode === 'offer') buttons.push({ label: 'Plus tard' }, { label: 'Accepter la mission', primary: true, onClick: () => { M.accept(dlg.id); toast('Mission acceptée : ' + M.M(dlg.id).title, '📜', 'good'); } });
    else if (dlg.mode === 'turnin') buttons.push({ label: 'Remettre', primary: true, onClick: () => { const r = M.turnIn(dlg.id); if (r !== null) eventPopup('Mission accomplie', M.M(dlg.id).title, r, [id]); } });
    else buttons.push({ label: 'Au revoir', primary: true });
    if (G.Sys.Suppliers.isSupplier(id)) buttons.unshift({ label: '🤝 Contrat de livraison', onClick: () => setTimeout(() => G.UI.negotiate(id), 0) });
    if (id === 'merou') buttons.unshift({ label: '⛵ Rentrer sur mon île', cls: 'gold', onClick: () => goHome() });
    buttons.unshift({ label: 'Fiche', onClick: () => { setTimeout(() => openChar(id), 0); } });
    modal({ title: E(d.name), html: '<div class="dialog"><img src="' + G.Art.icon('char', id, 96) + '" alt=""><div class="speech">' + E(dlg.text) + (first ? '<div class="small muted" style="margin-top:6px">🤝 ' + E(d.name) + ' pourra désormais visiter votre île.</div>' : '') + '</div></div>' + extra, buttons });
  }
  function objectivesHtml(mid) {
    const M = G.Sys.Missions; const m = M.M(mid);
    return m.objectives.map(o => { const p = M.isActive(mid) ? M.objProgress(mid, o) : { cur: 0, n: o.n || 1, ok: false }; return '<div class="row small" style="margin:3px 0"><span>' + (p.ok ? '✅' : '⬜') + ' ' + E(o.label) + '</span><span class="grow"></span><b>' + p.cur + '/' + p.n + '</b></div>'; }).join('');
  }
  function rewardText(r) {
    const p = []; if (r.coins) p.push('🪙 ' + r.coins); if (r.rep) p.push('⭐ ' + r.rep); if (r.disc) p.push('🔍 ' + r.disc); if (r.item) p.push('🏺 ' + G.D.items[r.item].name); if (r.recipe) p.push('📜 ' + G.D.recipes[r.recipe].name);
    if (r.res) for (const k in r.res) p.push(r.res[k] + '× ' + G.D.resources[k].name); if (r.flag === 'cave_open') p.push('🔓 Accès à la grotte'); if (r.flag === 'carte_araignees') p.push('🗺️ Carte maritime');
    return p.join(' · ');
  }
  function adoptDialog(sp, cb) {
    const a = G.D.animals[sp];
    const needs = Object.keys(a.needs).map(k => '<span class="tag">' + G.D.habitatParams[k].icon + ' ' + G.D.habitatParams[k].name + ' ' + a.needs[k] + '</span>').join(' ');
    modal({ title: '🔍 ' + E(a.name), html: '<div class="dialog"><img src="' + G.Art.icon('animal', sp, 96) + '" style="border-radius:12px;background:#eef6e6" alt=""><div class="grow small">' + E(a.desc) + '<br><b>Habitat :</b> ' + G.D.biomes[a.biome].name + ' · <b>Régime :</b> ' + a.diet + (a.social ? ' · <b>Sociable</b>' : '') + '<div style="margin-top:4px">' + needs + '</div></div></div><p class="small muted">L\'animal s\'est habitué à vous. Voulez-vous l\'accueillir dans votre zoo ? Il patientera dans la réserve jusqu\'à ce que vous lui attribuiez un habitat.</p>',
      buttons: [].concat(G.state.flags.camera && G.D.islands[a.origin].cameraAlbum ? [{ label: '📸 Photo pour l\'album', onClick: () => { setTimeout(() => G.Mini.photo(sp, () => adoptDialog(sp, cb)), 0); } }] : []).concat([{ label: 'Le laisser en liberté', onClick: () => cb(false) }, { label: 'Accueillir au zoo', primary: true, onClick: () => { G.Sys.Zoo.adopt(sp); G.Game.addRep(0.5, 'zoo'); G.Game.notify(a.name + ' rejoint la réserve du zoo !', '🦕', 'good'); G.State.save(true); cb(true); } }]), dismiss: false });
  }
  function exploreZone(isl, zone) { $('#exZone').innerHTML = '<b>' + E(zone) + '</b>' + E(isl); }
  let lastAct = undefined;
  function exploreAction(label) { if (label === lastAct) return; lastAct = label; const b = $('#exAction'); if (!label) b.classList.add('hidden'); else { b.textContent = label; b.classList.remove('hidden'); } }

  function embark(id) {
    if (G.Scenes.isOpen()) G.Scenes.close(true);
    closePanel(); G.Home.stopPlacing(); G.Home.stop();
    $('#tabs').classList.add('hidden'); $('#hint').classList.add('hidden'); $('#simInfo').classList.add('hidden'); $('#exHud').classList.remove('hidden');
    document.documentElement.style.setProperty('--tabs-h', '0px');
    G.Explore.start(id); G.Game.log('Expédition vers l\'' + G.D.islands[id].name, '⛵');
    toast('Bienvenue sur l\'' + G.D.islands[id].name + ' !', '⛵', 'good');
  }
  function goHome() {
    modals.slice().forEach(m => m.close());
    G.Explore.stop(); $('#exHud').classList.add('hidden'); $('#tabs').classList.remove('hidden'); $('#simInfo').classList.remove('hidden');
    document.documentElement.style.setProperty('--tabs-h', '64px');
    G.Home.start(); G.Audio.setScene('home'); G.State.save(true); hud(); toast('De retour au port de votre île.', '⚓');
  }

  /* Petit inventaire / passeport / missions pendant l'exploration */
  function bag() { modal({ title: '🎒 Sac d\'explorateur', html: G.Screens.inventoryHtml(), wide: true, onMount: el => bind(el, { item: d => showItem(d.id) }) }); }
  function passport(island = G.Explore.currentIsland() || 'prehistorique') { modal({ title: '📘 Passeport — ' + G.D.islands[island].name, html: G.Screens.passportHtml(island), wide: true }); }
  function missions() { modal({ title: '📜 Missions', html: G.Screens.missionsHtml(G.Explore.currentIsland() || 'prehistorique'), wide: true }); }

  function init() {
    document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => openTab(b.dataset.tab));
    $('#pClose').onclick = closePanel;
    G.Scenes.init();
    const mb = $('#bMute'); const setMute = () => { mb.textContent = G.state.settings.mute ? '🔇' : '🔊'; }; setMute(); mb.onclick = () => { G.state.settings.mute = !G.state.settings.mute; G.Audio.applyVolumes(); setMute(); G.State.save(true); };
    $('#bJournal').onclick = journal; $('#bSettings').onclick = () => G.Screens.settings();
    $('#exBag').onclick = bag; $('#exPass').onclick = () => passport(); $('#exMis').onclick = missions; $('#exBoat').onclick = () => G.Explore.goToBoat();
    $('#exAction').onclick = () => G.Explore.act();
    ['hud', 'inventory', 'codex', 'chars'].forEach(e => U.on(e, U.throttle(hud, 300)));
    ['museum', 'zoo', 'aquarium', 'bar', 'bar:queue', 'bar:served', 'ads', 'chars', 'gazette', 'buildings', 'inventory', 'missions', 'cycle', 'islands', 'codex'].forEach(e => U.on(e, () => { if (current) refresh(); }));
    U.on('missions', hint); U.on('bar:queue', hud);
    window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (modals.length) modals[modals.length - 1].close(); else if (current) closePanel(); } });
    setInterval(() => { if (G.Home.isRunning()) { const st = G.Sys.Sim.stats(); $('#simInfo').textContent = '👥 ' + st.visitors + '/' + st.cap + ' visiteurs · ~' + st.rate.toFixed(1) + '/min'; } G.Screens.tick && G.Screens.tick(); }, 1000);
  }

  return { toast, modal, modalOpen, confirm, bind, hud, openTab, closePanel, renderPanel, refresh, openBuilding, openChar, showItem, itemCard, itemFound, loreDialog, eventPopup, decorMenu, placingBanner, journal, npcDialog, objectivesHtml, rewardText, adoptDialog, exploreZone, exploreAction, embark, goHome, init, currentView, nextHint };
})();

</script>
<script>/* js/ui/screens.js */
/* ARCHIPEL — contenus des menus (Explorer, Gestion, Collections, Gazette, Paramètres) */

G.Screens = (() => {
  const U = G.U, E = U.esc, S = () => G.state, Art = () => G.Art;
  let live = [];
  let selIsland = 'prehistorique', selHab = 0, selTank = 0;
  const adForm = { kind: 'affiches', type: 'recette', target: '' };
  const panelPens = {}, panelTanks = {};

  function unmount() { live.forEach(l => cancelAnimationFrame(l.raf)); live = []; }
  function loopCanvas(cv, draw) {
    const l = { raf: 0 }; let last = 0, t = 0;
    const ctx = cv.getContext('2d');
    const fit = () => { const r = cv.getBoundingClientRect(); const d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.max(1, r.width * d); cv.height = Math.max(1, r.height * d); ctx.setTransform(d, 0, 0, d, 0, 0); return r; };
    let r = fit();
    const f = ts => { if (!document.body.contains(cv)) return; const dt = Math.min(0.1, (ts - (last || ts)) / 1000); last = ts; t += dt; if (cv.width < 2) r = fit(); draw(ctx, r.width, r.height, dt, t); l.raf = requestAnimationFrame(f); };
    l.raf = requestAnimationFrame(f); live.push(l);
  }
  const img = (kind, id, n = 56) => '<img src="' + Art().icon(kind, id, n) + '" alt="">';
  const bar = (v, cls = '') => '<div class="bar ' + (cls || (v > 0.7 ? 'good' : v > 0.4 ? 'warn' : 'bad')) + '"><i style="width:' + Math.round(U.clamp(v, 0, 1) * 100) + '%"></i></div>';
  const lv = (n, max = 3) => '<span class="lv">' + Array.from({ length: max }, (_, i) => '<i class="' + (i < n ? 'on' : '') + '"></i>').join('') + '</span>';
  const stat = (v, l) => '<div class="stat"><b>' + v + '</b><span>' + l + '</span></div>';
  const rarDot = r => '<span class="rar" style="background:' + G.D.rarities[r].color + '"></span>';

  /* ================= EXPLORER ================= */
  function chartSvg() {
    const s = S(); let h = '<svg class="chart" viewBox="0 0 1000 560" role="img" aria-label="Carte maritime de l\'archipel">';
    h += '<defs><pattern id="wv" width="60" height="30" patternUnits="userSpaceOnUse"><path d="M0 15 q15 -8 30 0 t30 0" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/></pattern></defs><rect width="1000" height="560" fill="#4f9fd0"/><rect width="1000" height="560" fill="url(#wv)"/>';
    h += '<g font-family="Georgia,serif" fill="#e9f4fb" opacity=".5" font-size="22"><text x="30" y="545">Mer des Brumes</text><text x="720" y="545">Océan d\'Azur</text></g>';
    const home = { x: 520, y: 300 }; const order = G.D.islandOrder;
    const pt = id => G.D.islands[id].chart;
    let prev = home;
    order.forEach(id => { const p = pt(id); const on = s.islands[id].unlocked; h += '<path d="M' + prev.x + ' ' + prev.y + ' Q ' + ((prev.x + p.x) / 2 + 40) + ' ' + ((prev.y + p.y) / 2 - 40) + ' ' + p.x + ' ' + p.y + '" fill="none" stroke="' + (on ? '#fff8ec' : 'rgba(255,255,255,.35)') + '" stroke-width="4" stroke-dasharray="10 10"/>'; prev = p; });
    const blob = (x, y, r, col, sand) => '<ellipse cx="' + x + '" cy="' + (y + 6) + '" rx="' + (r + 10) + '" ry="' + (r * 0.7 + 8) + '" fill="rgba(255,255,255,.25)"/><ellipse cx="' + x + '" cy="' + y + '" rx="' + (r + 4) + '" ry="' + (r * 0.7 + 3) + '" fill="' + sand + '"/><ellipse cx="' + x + '" cy="' + (y - 2) + '" rx="' + r + '" ry="' + (r * 0.68) + '" fill="' + col + '"/>';
    h += '<g class="isl" data-act="home">' + blob(home.x, home.y, 62, '#8cc663', '#efdba6') + '<text x="' + home.x + '" y="' + (home.y + 8) + '" font-size="34" text-anchor="middle">🏛️</text><text x="' + home.x + '" y="' + (home.y + 72) + '" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Votre île</text></g>';
    order.forEach(id => {
      const d = G.D.islands[id], p = d.chart, st = s.islands[id];
      const col = st.unlocked ? (d.palette.grass || '#8cc663') : '#9aa6ad';
      h += '<g class="isl" data-act="island" data-id="' + id + '" style="cursor:pointer">' + blob(p.x, p.y, 48, col, st.unlocked ? (d.palette.sand || '#efdba6') : '#c3c9cc');
      h += '<text x="' + p.x + '" y="' + (p.y + 10) + '" font-size="32" text-anchor="middle" opacity="' + (st.unlocked ? 1 : 0.6) + '">' + (st.unlocked ? d.icon : '🔒') + '</text>';
      h += '<text x="' + p.x + '" y="' + (p.y + 62) + '" font-size="17" font-weight="700" text-anchor="middle" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width="3" paint-order="stroke">' + E(d.short) + '</text>';
      if (id === selIsland) h += '<ellipse cx="' + p.x + '" cy="' + p.y + '" rx="66" ry="48" fill="none" stroke="#e9b949" stroke-width="4" stroke-dasharray="8 6"/>';
      if (st.completed) h += '<text x="' + (p.x + 40) + '" y="' + (p.y - 26) + '" font-size="22">⭐</text>';
      h += '</g>';
    });
    return h + '</svg>';
  }
  function passportHtml(island) {
    const pp = G.Sys.Missions.passport(island);
    return pp.rows.map(r => '<div style="margin:6px 0"><div class="row between small"><span>' + (r.cur >= r.n ? '✅' : '🔸') + ' ' + r.label + '</span><b>' + r.cur + ' / ' + r.n + '</b></div>' + bar(r.cur / r.n, r.cur >= r.n ? 'good' : '') + (r.detail ? '<div class="muted small">' + r.detail.map(E).join(' · ') + '</div>' : '') + '</div>').join('')
      + (pp.complete ? '<p class="tag good">Passeport complet ! Carte maritime obtenue.</p>' : '<p class="muted small">Terminez ces objectifs pour obtenir la carte maritime vers l\'île suivante. Les objets rares ne sont pas obligatoires.</p>');
  }
  function missionsHtml(island) {
    const M = G.Sys.Missions; const ids = Object.keys(G.D.missions).filter(id => M.M(id).island === island);
    const block = (title, list, fn) => list.length ? '<h4>' + title + '</h4>' + list.map(fn).join('') : '';
    const giver = id => E(G.D.characters[M.M(id).giver].name);
    return block('En cours', ids.filter(M.isActive), id => '<div class="card"><b>' + E(M.M(id).title) + '</b>' + (M.ready(id) ? ' <span class="tag good">Prête à rendre</span>' : '') + '<div class="small muted">Donnée par ' + giver(id) + '</div>' + G.UI.objectivesHtml(id) + '<div class="small muted">Récompense : ' + G.UI.rewardText(M.M(id).reward) + '</div></div>')
      + block('Disponibles', ids.filter(M.isAvailable), id => '<div class="list-item"><span style="font-size:22px">❗</span><div class="grow small"><b>' + E(M.M(id).title) + '</b><br>Parlez à ' + giver(id) + '</div></div>')
      + block('Accomplies', ids.filter(M.isDone), id => '<div class="list-item"><span style="font-size:22px">🏆</span><div class="grow small"><b>' + E(M.M(id).title) + '</b></div></div>')
      + block('Verrouillées', ids.filter(id => !M.st(id) && !M.isAvailable(id)), id => '<div class="list-item" style="opacity:.6"><span style="font-size:22px">🔒</span><div class="grow small"><b>' + E(M.M(id).title) + '</b><br>Après : ' + M.M(id).requires.map(r => E(M.M(r).title)).join(', ') + '</div></div>');
  }
  function explorer() {
    const d = G.D.islands[selIsland], st = S().islands[selIsland];
    let det = '<div class="card"><h3>' + d.icon + ' ' + E(d.name) + '</h3><p class="muted">' + E(d.desc) + '</p>';
    if (st.unlocked && d.playable) {
      det += '<button class="btn block warn" data-act="embark" data-id="' + selIsland + '">⛵ Embarquer avec le Capitaine Mérou</button><h4>📘 Passeport</h4>' + passportHtml(selIsland) + '</div><div class="card"><h3>📜 Missions</h3>' + missionsHtml(selIsland) + '</div>';
    } else if (st.unlocked) {
      det += '<p class="tag good">🗺️ Carte maritime obtenue !</p><p>Cette île est débloquée : son contenu explorable arrive dans une prochaine mise à jour.</p>' + planned(d) + '</div>';
    } else {
      const prevId = G.D.islandOrder[G.D.islandOrder.indexOf(selIsland) - 1];
      det += '<p><span class="tag bad">🔒 Verrouillée</span> Terminez le passeport de l\'' + E(G.D.islands[prevId].name) + ' pour obtenir la carte maritime.</p>' + planned(d) + '</div>';
    }
    return { html: chartSvg() + '<p class="muted small">Touchez une île sur la carte pour voir ses informations.</p>' + det, bind: { island: x => { selIsland = x.id; G.UI.renderPanel(); }, home: () => G.UI.closePanel(), embark: x => G.UI.embark(x.id) } };
  }
  function planned(d) {
    if (!d.planned) return '';
    const p = d.planned;
    return '<h4>Contenu prévu</h4><div class="small"><b>Zones :</b> ' + p.zones.map(E).join(' · ') + '<br><b>À découvrir :</b> ' + p.content.map(E).join(' · ') + '<br><b>Activités :</b> ' + p.activities.map(E).join(' · ') + '<br><b>Habitants :</b> ' + p.characters.map(E).join(' · ') + (p.note ? '<br><i>' + E(p.note) + '</i>' : '') + '</div>';
  }

  /* ================= GESTION ================= */
  const ENTER = { museum: 'Entrer dans le musée', zoo: 'Visiter le zoo', aquarium: 'Entrer dans l\'aquarium', bar: 'Ouvrir le service au bar' };
  function gestion(sub) {
    unmount(); const out = ({ museum, zoo, aquarium, bar: barPanel, ads, finances, staff, build })[sub]();
    if (ENTER[sub]) { out.html = '<button class="btn block warn" data-act="enter" data-k="' + sub + '" style="margin:4px 0 2px">🚪 ' + ENTER[sub] + '</button>' + out.html; out.bind = Object.assign({ enter: d => G.Scenes.open(d.k) }, out.bind); }
    return out;
  }
  function bstats(k) { const b = S().bstats[k]; return stat(U.fmt(b.visits), 'Visites') + stat(Math.round(b.sat * 100) + ' %', 'Satisfaction') + stat(U.fmt(b.rev), 'Recettes 🪙') + stat(Math.floor(b.rep), 'Réputation'); }

  /* ---- Musée ---- */
  function museum() {
    const M = G.Sys.Museum; const rooms = M.rooms(); const lvl = G.Game.bLevel('museum');
    let h = '<div class="card"><div class="row between"><h3>🏛️ ' + E(G.Game.bLevelData('museum').label) + '</h3>' + lv(lvl) + '</div><div class="stats">' + stat(M.score(), 'Score d\'exposition') + bstats('museum') + '</div><p class="muted small">Exposez des objets fidèles au thème de chaque salle : la cohérence et les salles complètes augmentent la satisfaction. Les doublons lassent les visiteurs.</p></div>';
    // atelier
    h += '<div class="card"><h3>🦴 Atelier de restauration</h3>' + Object.keys(G.D.restorations).map(id => { const r = G.D.restorations[id]; const need = Object.keys(r.needs).map(k => (S().res[k] || 0) + '/' + r.needs[k] + ' ' + E(G.D.resources[k].name)).join(', '); const ok = M.canRestore(id); return '<div class="list-item">' + (S().codex.items[id] ? img('item', id, 44) : img('silhouette', 'item|' + id, 44)) + '<div class="grow small"><b>' + E(G.D.items[id].name) + '</b> ' + (G.Game.itemCount(id) ? '<span class="tag good">possédé ×' + G.Game.itemCount(id) + '</span>' : '') + '<br>Fragments : ' + need + '</div><button class="btn small ' + (ok ? '' : 'disabled') + '" data-act="restore" data-id="' + id + '">Restaurer</button></div>'; }).join('') + '<p class="muted small">Les fragments se trouvent en fouillant (site de fouilles, pied du volcan). Moins de coups au puzzle = meilleure qualité (★).</p></div>';
    for (let i = 0; i < 3; i++) {
      if (i >= rooms.length) { h += '<div class="card" style="opacity:.6"><h3>🔒 ' + M.ROOM_NAMES[i] + '</h3><p class="muted small">Débloquée au niveau ' + (i + 1) + ' du musée (Gestion › Bâtiments).</p></div>'; continue; }
      const r = rooms[i], sc = M.roomScore(i);

    h += '<div class="small muted">Capacité : ' + fish.length + ' / ' + Q.capacity() + ' poissons. Chaque espèce a sa plage de température, son type d\'eau et un niveau de décor souhaité.</div></div>';
    h += '<div class="card"><h3>Habitants du bassin</h3>' + (fish.length ? fish.map(f => fishRow(f, true)).join('') : '<p class="muted">Bassin vide.</p>') + '</div>';
    const res = Q.reserve();
    h += '<div class="card"><h3>📦 Viviers de réserve (' + res.length + ')</h3>' + (res.length ? res.map(f => fishRow(f, false)).join('') : '<p class="muted small">Pêchez pendant vos explorations pour remplir l\'aquarium.</p>') + '</div>';

      tank: d => { selTank = +d.i; G.UI.renderPanel(); }, env: (d, el) => { if (!Q.setEnv(selTank, el.value)) G.UI.renderPanel(); }, temp: d => Q.setTemp(selTank, +d.d), clean: () => Q.clean(selTank), decor: () => Q.buyDecor(selTank),

    h += '<div class="card"><h3>Par établissement</h3><table class="tbl"><tr><th>Lieu</th><th>Visites</th><th>Satisf.</th><th>Répu.</th><th>Recettes</th><th>Dépenses</th></tr>' + ['museum', 'zoo', 'aquarium', 'bar', 'office'].map(k => { const b = s.bstats[k]; return '<tr><td>' + G.D.buildings[k].icon + ' ' + G.D.buildings[k].name + '</td><td>' + U.fmt(b.visits) + '</td><td>' + (k === 'office' ? '—' : Math.round(b.sat * 100) + ' %') + '</td><td>' + Math.floor(b.rep) + '</td><td>' + U.fmt(b.rev) + '</td><td>' + U.fmt(b.exp) + '</td></tr>'; }).join('') + '</table><p class="muted small">Dépenses du bureau : salaires (3 🪙/min par employé), entretien, campagnes et décorations.</p></div>';

  const DECO_ICON = { arbre: '🌳', fleurs: '🌷', banc: '🪑', lampadaire: '💡', fontaine: '⛲', statue_dino: '🗿' };
  function build() {
    let h = '<p class="muted small">Chaque établissement possède 3 niveaux. Les niveaux supérieurs demandent de la réputation et des points de découverte, gagnés en explorant.</p>';
    for (const k of ['museum', 'zoo', 'aquarium', 'bar', 'port', 'office']) {
      const b = G.D.buildings[k], l = G.Game.bLevel(k), next = b.levels[l];
      h += '<div class="card"><div class="row between"><h3>' + b.icon + ' ' + b.name + ' — ' + E(b.levels[l - 1].label) + '</h3>' + lv(l) + '</div><p class="muted small">' + E(b.desc) + '</p>';
      if (next) {
        const req = []; req.push((G.state.coins >= next.cost ? '✅' : '❌') + ' ' + U.fmt(next.cost) + ' 🪙'); if (next.rep) req.push((G.Game.rep() >= next.rep ? '✅' : '❌') + ' Réputation ' + next.rep); if (next.disc) req.push((G.state.discovery >= next.disc ? '✅' : '❌') + ' Découverte ' + next.disc);
        h += '<div class="row small"><span class="grow">Niveau suivant : <b>' + E(next.label) + '</b><br>' + req.join(' · ') + '</span><button class="btn small ' + (G.Game.canUpgrade(k).ok ? '' : 'disabled') + '" data-act="upgrade" data-k="' + k + '">Améliorer</button></div>';
      } else h += '<span class="tag good">Niveau maximum</span>';
      h += '</div>';
    }
    h += '<div class="card"><h3>🌳 Décorations</h3><p class="muted small">Les décorations embellissent l\'île, attirent les promeneurs (bancs et fontaines servent de lieux de repos). Touchez une décoration sur l\'île pour la retirer.</p><div class="grid">' + Object.keys(G.D.decorations).map(k => { const d = G.D.decorations[k]; const locked = d.needDisc && G.state.discovery < d.needDisc; return '<button class="tile ' + (locked ? 'empty' : '') + '" data-act="deco" data-k="' + k + '"><span style="font-size:34px">' + DECO_ICON[k] + '</span>' + E(d.name) + '<b>' + d.cost + ' 🪙</b>' + (locked ? '<span class="muted">🔒 ' + d.needDisc + ' découverte</span>' : '') + '</button>'; }).join('') + '</div></div>';
    return { html: h, bind: { upgrade: d => { const c = G.Game.canUpgrade(d.k); if (!c.ok) return G.UI.toast(c.reason, '🔒', 'bad'); G.UI.confirm('Améliorer : ' + G.D.buildings[d.k].name, 'Passer au niveau « ' + E(c.next.label) + ' » ?', 'Améliorer', () => G.Game.upgradeBuilding(d.k), c.next.cost); },
      deco: d => { const dd = G.D.decorations[d.k]; if (dd.needDisc && G.state.discovery < dd.needDisc) return G.UI.toast('Il faut ' + dd.needDisc + ' points de découverte.', '🔒', 'bad'); if (G.state.coins < dd.cost) return G.UI.toast('Pas assez de pièces.', '🪙', 'bad'); G.UI.closePanel(); G.Home.startPlacing(d.k); } } };

    } else if (sub === 'disc') {

      for (const iid of G.D.islandOrder.filter(k => G.D.islands[k].playable && s.islands[k].unlocked)) {

  /* ================= PARAMÈTRES ================= */
  function settings() {
    const s = S().settings;
    const html = '<h4>Sauvegarde</h4><p class="small muted">La partie est enregistrée automatiquement dans ce navigateur. Exportez-la pour la conserver ou la transférer sur un autre appareil.</p><div class="row"><button class="btn" data-act="export">⬇️ Exporter (fichier)</button><button class="btn alt" data-act="copy">📋 Copier le code</button><label class="btn alt">⬆️ Importer un fichier<input type="file" accept=".json,application/json" id="impFile" hidden></label><button class="btn alt" data-act="paste">📥 Coller un code</button><button class="btn alt" data-act="share">📤 Partager</button></div>'
      + '<h4>Mon personnage</h4><button class="btn alt small" data-act="avatar">🧑 Modifier mon personnage</button>'
      + '<h4>Son</h4><div class="row small"><span style="width:80px">🎵 Musique</span><input type="range" min="0" max="1" step="0.05" value="' + (s.music ?? 0.5) + '" data-act="vmusic" class="grow"></div><div class="row small"><span style="width:80px">🔔 Effets</span><input type="range" min="0" max="1" step="0.05" value="' + (s.sfx ?? 0.7) + '" data-act="vsfx" class="grow"></div><div class="row small"><label><input type="checkbox" data-act="mute" ' + (s.mute ? 'checked' : '') + '> Couper le son</label></div>'
      + '<h4>Application</h4>' + (G.PWA.standalone() ? '<p class="small tag good">✓ Archipel est installé comme une application.</p>' : '<button class="btn gold small" data-act="install">📲 Installer sur l\'écran d\'accueil</button><p class="small muted">Une fois installé, le jeu s\'ouvre comme une appli et fonctionne sans connexion.</p>')
      + '<h4>Affichage</h4><div class="row small"><label><input type="checkbox" data-act="names" ' + (s.names ? 'checked' : '') + '> Afficher les noms et étiquettes</label></div><div class="row small"><label><input type="checkbox" data-act="low" ' + (s.lowPower ? 'checked' : '') + '> Mode économie (téléphone : 30 i/s, résolution réduite)</label></div>'
      + '<h4>Saison</h4><select class="inp" data-act="season"><option value="auto">Automatique (date de l\'appareil)</option>' + Object.keys(G.D.seasons).map(k => '<option value="' + k + '"' + (s.season === k ? ' selected' : '') + '>' + G.D.seasons[k].icon + ' ' + G.D.seasons[k].name + '</option>').join('') + '</select>'
      + '<h4>Aide</h4><button class="btn alt small" data-act="help">Revoir le guide de démarrage</button>'
      + '<h4>Zone sensible</h4><button class="btn warn small" data-act="reset">Recommencer une nouvelle partie</button><p class="muted small">Archipel — version ' + G.VERSION + ' · sauvegarde v' + G.SAVE_VERSION + '</p>';
    G.UI.modal({ title: '⚙️ Paramètres', html, wide: true, onMount: (el, m) => {
      G.UI.bind(el, {
        export: () => { const blob = new Blob([G.State.exportString()], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'archipel-sauvegarde-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); G.UI.toast('Sauvegarde exportée.', '💾', 'good'); },
        copy: () => { const str = G.State.exportString(); (navigator.clipboard ? navigator.clipboard.writeText(str) : Promise.reject()).then(() => G.UI.toast('Code copié dans le presse-papiers.', '📋', 'good'), () => G.UI.modal({ title: 'Code de sauvegarde', html: '<textarea class="inp" style="width:100%;height:160px">' + E(str) + '</textarea>' })); },
        paste: () => G.UI.modal({ title: 'Importer un code', html: '<textarea class="inp" id="impTxt" style="width:100%;height:160px" placeholder="Collez ici le code de sauvegarde"></textarea><p class="small muted">Attention : la partie actuelle sera remplacée.</p>', buttons: [{ label: 'Annuler' }, { label: 'Importer', primary: true, onClick: () => doImport(document.getElementById('impTxt').value) }] }),
        names: (d, e) => { s.names = e.checked; G.State.save(true); }, low: (d, e) => { s.lowPower = e.checked; G.State.save(true); window.dispatchEvent(new Event('resize')); },
        season: (d, e) => { s.season = e.value; G.State.save(true); G.UI.hud(); G.UI.toast('Saison : ' + G.Game.seasonData().name, G.Game.seasonData().icon); },
        help: () => { m.close(); G.Main.welcome(true); },
        avatar: () => { m.close(); G.Avatar.open(false); },
        vmusic: (d, e) => { s.music = +e.value; G.Audio.applyVolumes(); G.State.save(); }, vsfx: (d, e) => { s.sfx = +e.value; G.Audio.applyVolumes(); G.Audio.sfx('coin'); G.State.save(); },
        mute: (d, e) => { s.mute = e.checked; G.Audio.applyVolumes(); G.State.save(true); const mb = document.getElementById('bMute'); if (mb) mb.textContent = s.mute ? '🔇' : '🔊'; },
        install: () => G.PWA.install(),
        share: () => { const str = G.State.exportString(); const file = new File([str], 'archipel-sauvegarde.json', { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: 'Sauvegarde Archipel' }).catch(() => {}); else G.UI.toast('Partage non disponible ici : utilisez « Exporter ».', '📤'); },
        reset: () => G.UI.confirm('Recommencer ?', 'Toute la progression sera effacée (pensez à exporter votre sauvegarde avant).', 'Tout effacer', () => G.UI.confirm('Vraiment sûr·e ?', 'Cette action est définitive.', 'Oui, recommencer', () => { G.State.reset(); location.reload(); })),
      });
      el.querySelector('#impFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(f); });
    } });
  }
  function doImport(str) {
    try { G.State.importString(str); G.UI.toast('Sauvegarde importée ! Rechargement…', '✅', 'good'); setTimeout(() => location.reload(), 700); }
    catch (e) { G.UI.toast('Import impossible : ' + e.message, '⚠️', 'bad'); }
  }

  /* Rafraîchissement léger des éléments « live » (sans reconstruire le panneau) */
  function tick() {
    const cur = G.UI.currentView(); if (!cur || cur.tab !== 'gestion') return;
    if (cur.sub === 'ads') { const el = document.getElementById('adLive'); if (el) el.innerHTML = adsLive(); }
    if (cur.sub === 'bar') document.querySelectorAll('[data-live="order"]').forEach(el => { const o = G.Sys.Bar.queue.find(x => x.id === el.dataset.id); if (o) el.innerHTML = bar(1 - (Date.now() - o.created) / 1000 / o.patience); });
  }

  return { explorer, gestion, collections, gazette, settings, inventoryHtml, passportHtml, missionsHtml, unmount, tick, showSpecies };

<script>/* js/ui/fx.js */
/* ARCHIPEL — effets visuels de récompense (confettis, étoiles) */

G.FX = (() => {
  let cv = null, c = null, parts = [], raf = 0;
  function ensure() {
    if (cv) return; cv = document.createElement('canvas'); cv.id = 'fxCanvas';
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70';
    document.body.appendChild(cv); c = cv.getContext('2d');
  }
  function confetti(n = 120, opts = {}) {
    ensure(); const W = innerWidth, H = innerHeight; const d = Math.min(2, devicePixelRatio || 1);
    cv.width = W * d; cv.height = H * d; c.setTransform(d, 0, 0, d, 0, 0);
    const cols = ['#e76f51', '#2a9d8f', '#e9b949', '#3d7dd8', '#8c5fbf', '#f28ab2', '#5aa04a'];
    const ox = opts.x ?? W / 2, oy = opts.y ?? H * 0.35;
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7; parts.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5, r: 3 + Math.random() * 4, col: cols[i % cols.length], rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, life: 1.1 + Math.random() * 0.9, star: opts.stars && Math.random() < 0.5 }); }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  let last = 0;
  function tick(ts) {
    const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts;
    c.clearRect(0, 0, cv.width, cv.height);
    for (const p of parts) {
      const f = dt * 60; p.vy += 0.22 * f; p.vx *= Math.pow(0.99, f); p.x += p.vx * f; p.y += p.vy * f; p.rot += p.vr; p.life -= dt;
      c.save(); c.globalAlpha = Math.max(0, Math.min(1, p.life)); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.col;
      if (p.star) { c.font = (p.r * 4) + 'px sans-serif'; c.fillText('★', -p.r, p.r); } else c.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      c.restore();
    }
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    if (parts.length) raf = requestAnimationFrame(tick); else { raf = 0; last = 0; c.clearRect(0, 0, cv.width, cv.height); }
  }
  /* Célébration : son + confettis */
  function celebrate(kind = 'fanfare', n = 140) { confetti(n, { stars: true }); G.Audio && G.Audio.sfx(kind); }
  return { confetti, celebrate };
})();

</script>
<script>/* js/ui/minigames.js */
/* ARCHIPEL — mini-jeux : fouilles, pêche, approche d'animal, restauration, préparation au bar */

G.Mini = (() => {
  const U = G.U, E = U.esc, Art = () => G.Art;

  /* ================= FOUILLES ================= */
  function dig(table, onDone) {
    const W = 7, H = 5; const season = G.Game.season(); const loot = G.D.lootTables[table].filter(x => !x.season || x.season === season);
    const cells = Array.from({ length: W * H }, (_, i) => ({ i, layer: Math.random() < 0.45 ? 2 : 1, find: -1 }));
    const finds = []; const nFinds = U.randi(2, 3) + (table === 'volcan' && G.Sys.Gazette.eventId() === 'eruption' ? 1 : 0);
    for (let k = 0; k < nFinds; k++) {
      const e = U.weighted(loot, x => x.w);
      for (let tries = 0; tries < 40; tries++) {
        const horiz = Math.random() < 0.6; const sx = U.randi(0, horiz ? W - e.size : W - 1), sy = U.randi(0, horiz ? H - 1 : H - e.size);
        const idxs = Array.from({ length: e.size }, (_, j) => (sy + (horiz ? 0 : j)) * W + sx + (horiz ? j : 0));
        if (idxs.every(i => cells[i].find < 0)) { idxs.forEach(i => cells[i].find = finds.length); finds.push({ e, idxs, got: false }); break; }
      }
    }
    let hits = 16; const got = [];
    const iconOf = f => f.e.kind === 'item' ? Art().icon('item', f.e.id, 64) : Art().icon('res', f.e.id, 64);
    const nameOf = f => f.e.kind === 'item' ? G.D.items[f.e.id].name : (f.e.n || 1) + '× ' + G.D.resources[f.e.id].name;
    let m;
    function render(el) {
      el.querySelector('#digHits').textContent = hits;
      el.querySelector('#digFound').textContent = got.length + ' / ' + finds.length;
      const grid = el.querySelector('.mg-grid'); grid.innerHTML = '';
      cells.forEach(c => {
        const b = document.createElement('button'); b.className = 'mg-cell l' + c.layer + (c.find >= 0 && finds[c.find].got ? ' got' : '');
        if (c.layer === 0 && c.find >= 0) b.innerHTML = '<img src="' + iconOf(finds[c.find]) + '" alt="">';
        else if (c.layer === 0) b.innerHTML = '<span style="opacity:.4">·</span>';
        b.onclick = () => hit(c, el); grid.appendChild(b);
      });
    }
    function hit(c, el) {
      if (hits <= 0 || c.layer === 0) return;
      c.layer--; hits--; G.Audio.sfx('thud');
      if (c.find >= 0) { const f = finds[c.find]; if (!f.got && f.idxs.every(i => cells[i].layer === 0)) { f.got = true; got.push(f); G.Audio.sfx('pop'); G.UI.toast('Trouvé : ' + nameOf(f), '⛏️', 'good'); } }
      render(el);
      if (got.length === finds.length || hits <= 0) setTimeout(finish, 450);
    }
    let finished = false;
    function finish() {
      if (finished) return; finished = true; m && m.close();
      got.forEach(f => { if (f.e.kind === 'item') G.Game.addItem(f.e.id); else G.Game.addRes(f.e.id, f.e.n || 1); });
      const d = G.Game.addDisc(3 + got.length * 3, true);
      onDone && onDone(got);

        + (B.queue.some(x => !x.inService) ? '<button class="btn block" data-act="again">Client suivant →</button>' : '');
      step = 6; render();
    }
    m = G.UI.modal({ title: '☕ Bar-café', wide: true, dismiss: false, html: '', buttons: [{ label: 'Fermer' }], onClose: () => { cancelAnimationFrame(raf); clearInterval(clock); if (!served) { order.inService = false; U.emit('bar:queue'); } } });

<script>/* js/ui/minigames2.js */
/* ARCHIPEL — v0.4 : photo naturaliste, énigme des toiles, éditeur d'avatar, installation en appli */

/* ================= PHOTO (Île des Araignées) ================= */
G.Mini.photo = function (spId, cb) {
  const U = G.U, E = U.esc, A = G.Art; const sp = G.D.animals[spId]; const known = !!G.state.codex.animals[spId];
  const speed = { commun: 0.9, peu: 1.2, rare: 1.5, legendaire: 1.8 }[sp.rarity];
  let film = 3, done = false, raf = 0, last = 0, t = 0, m, flash = 0, focus = 0, fdir = 1;
  const pos = { x: 0.5, y: 0.6, tx: 0.5, ty: 0.6, timer: 0, facing: 1 };
  const html = '<p class="small muted">Gardez l\'animal dans le cadre et déclenchez quand l\'image est <b>nette</b> (jauge verte). ' + film + ' photos sur la pellicule.</p><canvas id="phCv" style="width:100%;height:220px;border-radius:14px;display:block;touch-action:none"></canvas><div class="row small" style="margin:6px 0"><span>Netteté</span><div class="grow"><div class="bar"><i id="phF" style="width:0%"></i></div></div><span id="phFilm">🎞️ ' + film + '</span></div><button class="btn big-btn warn" id="phBtn">📸 Déclencher</button>';
  function inFrame(W, H) { const fx = W * 0.3, fy = H * 0.2, fw = W * 0.4, fh = H * 0.62; const ax = pos.x * W, ay = pos.y * H; return ax > fx && ax < fx + fw && ay > fy + 20 && ay < fy + fh + 10; }
  function finish(stars) {
    if (done) return; done = true; cancelAnimationFrame(raf); m.close();
    if (stars) {
      const prev = G.state.photos[spId] || 0; G.state.photos[spId] = Math.max(prev, stars);
      G.UI.toast('Photo ' + '★'.repeat(stars) + ' : ' + (sp.name), '📸', 'good');
    } else G.UI.toast('Pellicule épuisée… l\'animal s\'est éloigné.', '🎞️', 'bad');
    cb(!!stars, stars);
  }
  // (sur l'Île des Araignées, la photo est désormais un bonus pour l'album, après l'approche)
  function shoot() {
    if (done || film <= 0) return; film--; flash = 1; G.Audio.sfx('shutter');
    const cv = m.el.querySelector('#phCv'); const r = cv.getBoundingClientRect();
    const ok = inFrame(r.width, r.height) && focus > 0.55;
    m.el.querySelector('#phFilm').textContent = '🎞️ ' + film;
    if (ok) { const stars = focus > 0.9 ? 3 : focus > 0.72 ? 2 : 1; setTimeout(() => finish(stars), 350); }
    else { G.UI.toast(inFrame(r.width, r.height) ? 'Photo floue !' : 'Raté, l\'animal est hors du cadre !', '📷'); if (film <= 0) setTimeout(() => finish(0), 400); }
  }
  function frame(ts) {
    if (done) return; const dt = Math.min(0.05, (ts - (last || ts)) / 1000); last = ts; t += dt;
    pos.timer -= dt; if (pos.timer <= 0) { pos.timer = U.rand(0.8, 2) / speed; pos.tx = U.rand(0.1, 0.9); pos.ty = U.rand(0.45, 0.85); }
    const dx = pos.tx - pos.x, dy = pos.ty - pos.y; pos.x += dx * dt * 1.6 * speed; pos.y += dy * dt * 1.6 * speed; if (Math.abs(dx) > 0.01) pos.facing = dx > 0 ? 1 : -1;
    focus += fdir * dt * (0.7 + speed * 0.25); if (focus >= 1) { focus = 1; fdir = -1; } if (focus <= 0) { focus = 0; fdir = 1; }
    const el = m.el; el.querySelector('#phF').style.width = (focus * 100) + '%'; el.querySelector('#phF').parentNode.className = 'bar ' + (focus > 0.72 ? 'good' : focus > 0.55 ? 'warn' : 'bad');
    const cv = el.querySelector('#phCv'); const r = cv.getBoundingClientRect(); const d = Math.min(2, devicePixelRatio || 1);
    if (cv.width !== Math.round(r.width * d)) { cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
    const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); const W = r.width, H = r.height;
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2f4a3a'); g.addColorStop(1, '#4f6a45'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 7; i++) A.tree(c, 20 + i * W / 6, H * 0.5 + (i % 2) * 10, 1.4, '#243a2a', t);
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; c.beginPath(); c.moveTo(W * 0.8, H * 0.25); c.lineTo(W * 0.8 + Math.cos(a) * 50, H * 0.25 + Math.sin(a) * 50); c.stroke(); }
    const blur = (1 - focus) * 6; if ('filter' in c) c.filter = 'blur(' + blur.toFixed(1) + 'px)';
    A.drawAnimal(c, spId, pos.x * W, pos.y * H, 2.2, t, pos.facing, 'walk');
    if ('filter' in c) c.filter = 'none';
    const fx = W * 0.3, fy = H * 0.2, fw = W * 0.4, fh = H * 0.62; const okF = inFrame(W, H);
    c.strokeStyle = okF ? '#9fe870' : 'rgba(255,255,255,.85)'; c.lineWidth = 3;
    for (const [x, y, sx, sy] of [[fx, fy, 1, 1], [fx + fw, fy, -1, 1], [fx, fy + fh, 1, -1], [fx + fw, fy + fh, -1, -1]]) { c.beginPath(); c.moveTo(x + sx * 18, y); c.lineTo(x, y); c.lineTo(x, y + sy * 18); c.stroke(); }
    c.fillStyle = 'rgba(255,255,255,.8)'; c.font = '700 12px system-ui'; c.fillText('REC ●', 10, 18);
    if (flash > 0) { c.fillStyle = 'rgba(255,255,255,' + flash + ')'; c.fillRect(0, 0, W, H); flash -= dt * 3; }
    raf = requestAnimationFrame(frame);
  }
  m = G.UI.modal({ title: '📸 Photographier ' + (known ? E(sp.name) : 'une espèce inconnue'), html, dismiss: false, buttons: [{ label: 'Renoncer', onClick: () => { done = true; cancelAnimationFrame(raf); } }], onMount: el => { el.querySelector('#phBtn').addEventListener('pointerdown', e => { e.preventDefault(); shoot(); }); raf = requestAnimationFrame(frame); } });
};

/* ================= ÉNIGME DES TOILES (mémoire de motifs) ================= */
G.Mini.web = function (len, cb) {
  const U = G.U; let round = 0, seq = [], input = [], busy = true, errors = 0, m;
  const rounds = [len, len + 1, len + 2];
  const pts = Array.from({ length: 6 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 3; return { x: 50 + Math.cos(a) * 38, y: 50 + Math.sin(a) * 38 }; });
  const html = '<p class="small muted">Les fils vibrent selon un motif. Observez, puis touchez les mêmes nœuds dans le même ordre. 3 motifs à reproduire.</p><div style="position:relative;width:min(300px,80vw);aspect-ratio:1;margin:8px auto"><svg viewBox="0 0 100 100" style="position:absolute;inset:0;width:100%;height:100%"><g stroke="#cfd8e0" stroke-width=".6" fill="none">' + pts.map(p => '<line x1="50" y1="50" x2="' + p.x + '" y2="' + p.y + '"/>').join('') + [12, 24, 36].map(r => '<polygon points="' + pts.map(p => (50 + (p.x - 50) * r / 38) + ',' + (50 + (p.y - 50) * r / 38)).join(' ') + '"/>').join('') + '</g></svg>' + pts.map((p, i) => '<button class="web-node" data-i="' + i + '" style="left:' + p.x + '%;top:' + p.y + '%"></button>').join('') + '</div><p class="small" style="text-align:center" id="wbTxt">Observez…</p>';
  function light(i, ms = 380) { const b = m.el.querySelector('.web-node[data-i="' + i + '"]'); if (!b) return; b.classList.add('on'); G.Audio.sfx('note', i); setTimeout(() => b.classList.remove('on'), ms); }
  function play() {
    busy = true; input = []; m.el.querySelector('#wbTxt').textContent = 'Motif ' + (round + 1) + ' / 3 — observez…';
    seq = Array.from({ length: rounds[round] }, () => U.randi(0, 5));
    seq.forEach((k, j) => setTimeout(() => light(k), 600 + j * 560));
    setTimeout(() => { busy = false; m.el.querySelector('#wbTxt').textContent = 'À vous ! (' + seq.length + ' notes)'; }, 600 + seq.length * 560);
  }
  function press(i) {
    if (busy) return; light(i, 200); input.push(i);
    const k = input.length - 1;
    if (input[k] !== seq[k]) { errors++; G.Audio.sfx('fail'); if (errors >= 3) { m.close(); G.UI.toast('Le motif s\'est brouillé… réessayez plus tard.', '🕸️', 'bad'); cb(false); return; } m.el.querySelector('#wbTxt').textContent = 'Raté ! On recommence ce motif (' + (3 - errors) + ' essai(s) restants).'; setTimeout(play, 900); busy = true; return; }
    if (input.length === seq.length) { round++; if (round >= 3) { m.close(); cb(true); return; } busy = true; m.el.querySelector('#wbTxt').textContent = 'Bravo !'; G.Audio.sfx('chime'); setTimeout(play, 900); }
  }
  m = G.UI.modal({ title: '🕸️ L\'énigme de la toile', html, dismiss: false, buttons: [{ label: 'Abandonner' }], onMount: el => { el.querySelectorAll('.web-node').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); press(+b.dataset.i); })); setTimeout(play, 300); } });
};

<script>/* js/ui/negotiate.js */
/* ARCHIPEL — négociation d'un contrat de livraison avec un habitant */

G.UI.negotiate = function (who) {
  const U = G.U, E = U.esc, SUP = G.Sys.Suppliers; const d = G.D.suppliers[who]; const ch = G.D.characters[who];
  if (!d) return;
  if (!G.state.chars[who].met) { G.UI.toast('Il faut d\'abord rencontrer ' + ch.name + '.', '🤝'); return; }
  const cd = SUP.cooldownLeft(who);
  if (cd > 0) { G.UI.toast(ch.name + ' ne veut plus discuter pour le moment (' + Math.ceil(cd / 60000) + ' min).', '😤', 'bad'); return; }
  const resList = Object.keys(d.offers);
  let res = resList[0], qty = G.D.supplyQty[1], T = null, ask = 0, offer = 0, patience = 3, round = 0, phase = 'choose', line = d.pitch;
  const cur = SUP.contractOf(who);
  const LINES = {
    low: ['Tu te moques de moi ?', 'À ce prix-là, je reste chez moi.', 'Sérieusement ?', 'Même pas en rêve.'],
    counter: ['Bon… je peux descendre un peu.', 'Allez, fais un effort, toi aussi.', 'C\'est mon dernier mot… presque.', 'Hmm. Proposition intéressante, mais non.'],
    deal: ['Marché conclu !', 'Tope là !', 'D\'accord, ça me va.', 'Affaire faite.'],
    angry: ['Bon, ça suffit. Reviens plus tard.', 'Tu me fais perdre mon temps !'],
  };
  const m = G.UI.modal({ title: '🤝 Négocier avec ' + E(ch.name), wide: true, dismiss: false, html: '<div id="ngBox"></div>', buttons: [{ label: 'Fermer' }], onMount: el => render(el) });
  function render(el) {
    const box = el.querySelector('#ngBox'); let h = '<div class="dialog"><img src="' + G.Art.icon('char', who, 96) + '" alt=""><div class="speech">' + E(line) + '<div class="small muted" style="margin-top:4px">Patience : ' + '❤️'.repeat(patience) + '🤍'.repeat(3 - patience) + '</div></div></div>';
    if (cur && phase === 'choose') h += '<div class="card small">📋 Contrat actuel : <b>' + cur.qty + '× ' + E(G.D.resources[cur.res].name) + '</b> toutes les ' + cur.every + ' min pour <b>' + cur.price + ' 🪙</b> (' + cur.delivered + ' livraisons). <button class="btn small alt" data-act="cancel">Résilier</button></div>';
    if (phase === 'choose') {
      h += '<h4>Que voulez-vous recevoir ?</h4><div class="chips">' + resList.map(r => '<button class="chip ' + (r === res ? 'on' : '') + '" data-act="res" data-r="' + r + '"><img src="' + G.Art.icon('res', r, 32) + '" style="width:20px;height:20px;vertical-align:middle"> ' + E(G.D.resources[r].name) + '</button>').join('') + '</div>';
      h += '<h4>Quantité par livraison (toutes les ' + G.D.supplyEvery + ' min)</h4><div class="chips">' + G.D.supplyQty.map(q => '<button class="chip ' + (q === qty ? 'on' : '') + '" data-act="qty" data-q="' + q + '">' + q + ' unités</button>').join('') + '</div>';
      h += '<button class="btn block warn" data-act="start" style="margin-top:12px">💬 Demander son prix</button><p class="small muted">Contrats possibles : ' + SUP.contracts().length + ' / ' + SUP.maxContracts() + ' (le Bureau de direction en ajoute). Le paiement se fait à chaque livraison.</p>';
    } else if (phase === 'nego') {
      const unit = (offer / qty).toFixed(1);
      h += '<div class="stats"><div class="stat"><b>' + ask + ' 🪙</b><span>Son prix (par livraison)</span></div><div class="stat"><b id="ngOffer">' + offer + ' 🪙</b><span>Votre offre · ' + unit + ' 🪙/unité</span></div></div>';
      h += '<div class="row" style="margin:10px 0"><button class="btn small alt" data-act="adj" data-v="-5">−5</button><button class="btn small alt" data-act="adj" data-v="-1">−1</button><input type="range" class="grow" id="ngRange" min="' + Math.round(ask * 0.35) + '" max="' + ask + '" value="' + offer + '"><button class="btn small alt" data-act="adj" data-v="1">+1</button><button class="btn small alt" data-act="adj" data-v="5">+5</button></div>';
      h += '<div class="row"><button class="btn alt" data-act="quit">Laisser tomber</button><span class="grow"></span><button class="btn gold" data-act="acceptAsk">Accepter ' + ask + ' 🪙</button><button class="btn warn" data-act="propose">Proposer ' + offer + ' 🪙</button></div>';
      h += '<p class="small muted">Astuce : une offre trop basse vexe (patience −1). Un habitant de bonne humeur, ou avec qui vous avez déjà fait affaire, est plus conciliant. Tour ' + (round + 1) + '/5.</p>';
    } else if (phase === 'done') {
      h += '<p class="tag good">Contrat signé !</p><p class="small">Pensez à ajuster le prix de vos boissons (Gestion › Bar › Carte & prix) si vos ingrédients vous coûtent cher.</p>';
    } else if (phase === 'fail') {
      h += '<p class="tag bad">Négociation rompue.</p><p class="small">Vous pourrez réessayer dans 10 minutes, ou augmenter le prix de vos boissons pour vous permettre son tarif.</p>';
    }
    box.innerHTML = h;
    G.UI.bind(box, {
      res: x => { res = x.r; render(el); }, qty: x => { qty = +x.q; render(el); }, cancel: () => { SUP.cancel(who); m.close(); },
      start: () => { T = SUP.terms(who, res, qty); ask = T.ask; offer = Math.round(T.ask * 0.6); phase = 'nego'; line = 'Pour ' + qty + '× ' + G.D.resources[res].name.toLowerCase() + ' toutes les ' + G.D.supplyEvery + ' minutes… je dirais ' + ask + ' pièces.'; render(el); },
      adj: x => { offer = U.clamp(offer + +x.v, 1, ask); render(el); },
      quit: () => { m.close(); },
      acceptAsk: () => deal(ask, el),
      propose: () => {
        round++;
        if (offer >= T.floor) return deal(offer, el);
        if (offer < T.floor * 0.75) { patience--; line = U.pick(LINES.low); G.Audio.sfx('fail'); }
        else { line = U.pick(LINES.counter); }
        ask = Math.max(T.floor, Math.round(ask - (ask - offer) * U.rand(0.25, 0.45)));
        if (offer >= ask) return deal(ask, el);
        if (patience <= 0 || round >= 5) { phase = 'fail'; line = U.pick(LINES.angry); SUP.refuse(who, 10); }
        else line += ' ' + ask + ' pièces.';
        render(el);
      },
    });
    const rg = box.querySelector('#ngRange'); if (rg) rg.oninput = () => { offer = +rg.value; const o = box.querySelector('#ngOffer'); if (o) o.textContent = offer + ' 🪙'; const pb = box.querySelector('[data-act=propose]'); if (pb) pb.textContent = 'Proposer ' + offer + ' 🪙'; };
  }
  function deal(price, el) {

    G.Sys.Chars.mood(who, 4); phase = 'done'; render(el);

};

/* Décors du bar : emplacements et catalogue (débloqués en explorant les îles) */
G.UI.barDecor = function () {
  const E = G.U.esc, B = G.Sys.Bar, S = G.state.bar;
  const ICON = { mur: '🖼️', plafond: '💡', comptoir: '🪵', coin: '🪴' };
  const m = G.UI.modal({ title: '🎨 Décor du bar', wide: true, html: '<div id="bdBox"></div>', onMount: el => render(el) });
  function render(el) {
    const theme = B.themeIsland();
    let h = '<p class="small muted">Chaque île explorée débloque de nouveaux décors. Ils augmentent la satisfaction des clients. Décor complet d\'une même île (les 4 emplacements) : <b>Ambiance</b>, +10 % sur tous les prix.</p>' + (theme ? '<p class="tag good">✨ Ambiance ' + E(G.D.islands[theme].name) + ' active : +10 % sur les prix</p>' : '') + '<p class="small">Bonus de satisfaction actuel : <b>+' + Math.round(B.decorSat() * 100) + ' %</b></p>';
    for (const slot in G.D.barDecorSlots) {
      const cur = S.decorSlots[slot];
      h += '<h4>' + G.D.barDecorSlots[slot] + ' — ' + (cur ? E(G.D.barDecor[cur].name) : '<span class="muted">vide</span>') + '</h4><div class="grid">';
      for (const id in G.D.barDecor) {
        const d = G.D.barDecor[id]; if (d.slot !== slot) continue;
        const own = S.decorOwned[id], un = B.decorUnlocked(id), on = cur === id;
        const isl = d.island === 'archipel' ? 'Archipel' : G.D.islands[d.island].short;
        h += '<button class="tile ' + (on ? 'sel ' : '') + (un ? '' : 'empty') + '" data-act="' + (own ? 'use' : 'buy') + '" data-id="' + id + '"' + (un ? '' : ' disabled') + '><span style="font-size:30px">' + (un ? ICON[slot] : '🔒') + '</span><b>' + E(d.name) + '</b><span class="muted">' + E(isl) + ' · +' + Math.round(d.sat * 100) + ' %</span>' + (on ? '<span class="tag good">Installé</span>' : own ? '<span class="tag">Installer</span>' : un ? '<span class="tag gold">' + d.cost + ' 🪙</span>' : '<span class="muted" style="font-size:10px">' + E(B.unlockText(id)) + '</span>') + '</button>';
      }
      h += '</div>';
    }
    el.querySelector('#bdBox').innerHTML = h;
    G.UI.bind(el.querySelector('#bdBox'), {
      buy: d => { const dd = G.D.barDecor[d.id]; G.UI.confirm('Acheter « ' + dd.name + ' » ?', E(dd.desc), 'Acheter', () => { B.buyDecor(d.id); render(el); }, dd.cost); },
      use: d => { const dd = G.D.barDecor[d.id]; B.setSlot(dd.slot, S.decorSlots[dd.slot] === d.id ? null : d.id); render(el); },
    });
  }
};

<script>/* js/ui/scenes.js */
/* ARCHIPEL — intérieurs des établissements (vue plein écran)

G.Scenes = (() => {
  const U = G.U, E = U.esc, A = G.Art, $ = s => document.querySelector(s);

  const cam = { x: 0, y: 0, z: 1 };

  const pens = {}, tanks = {}, walkers = {}, fedAt = {};

  /* ================= CADRE ================= */
  const TITLES = { museum: '🏛️ Musée', zoo: '🦕 Zoo', aquarium: '🐠 Aquarium', bar: '☕ Bar-café' };
  function open(k) {
    if (cur) close(true);
    cur = k; G.Audio.setScene(k); G.UI.closePanel(); G.Home.stopPlacing && G.Home.stopPlacing(); G.Home.setHidden(true);
    $('#scene').classList.remove('hidden'); $('#scene').dataset.k = k; $('#tabs').classList.add('hidden'); $('#hint').classList.add('hidden'); $('#simInfo').classList.add('hidden');
    $('#scTitle').textContent = TITLES[k];
    $('#scBar').classList.toggle('hidden', k !== 'bar'); cv.classList.toggle('hidden', k === 'bar');
    cam.x = 0; cam.y = 0;
    if (k === 'bar') Bar.open(); else resize();
    info(); last = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
  }
  function close(silent) {
    if (!cur) return;
    if (cur === 'bar') Bar.close();
    cur = null; cancelAnimationFrame(raf);
    $('#scene').classList.add('hidden'); $('#tabs').classList.remove('hidden'); $('#simInfo').classList.remove('hidden');
    G.Home.setHidden(false); G.Audio.setScene('home'); if (!silent) G.UI.hud();
  }
  function isOpen() { return !!cur; }
  function info() {

    let extra = '';
    if (cur === 'museum') extra = '🏺 Score ' + G.Sys.Museum.score();
    if (cur === 'zoo') { const w = G.Sys.Zoo.avgWelfare(); extra = '💚 Bien-être ' + (w === null ? '—' : Math.round(w * 100) + ' %'); }
    if (cur === 'aquarium') { const w = G.Sys.Aquarium.avgHappiness(); extra = '💙 Bonheur ' + (w === null ? '—' : Math.round(w * 100) + ' %'); }
    if (cur === 'bar') extra = '⭐ Satisfaction ' + Math.round(b.sat * 100) + ' %';
    el.innerHTML = '<span>' + E(lv) + '</span><span>' + extra + '</span><span>👥 ' + U.fmt(b.visits) + ' visites</span>';
  }

  function resize() {
    const r = cv.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
    vw = r.width; vh = r.height; cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    layout();
  }
  function layout() {
    if (cur === 'museum') { cam.z = U.clamp(vh / 600, 0.45, 1.3); world = { w: Museum.ROOM_W * 3, h: 600 }; }
    else if (cur === 'aquarium') { cam.z = 1; world = Aqua.layout(); }
    else if (cur === 'zoo') { cam.z = 1; world = Zoo.layout(); }

  function clampCam() {

  function plate(s, x, y, maxW, bg = 'rgba(255,248,236,.95)', col = '#3a2f26', size = 12) {
    c.font = '700 ' + size + 'px Nunito, system-ui, sans-serif'; let str = s; while (c.measureText(str).width > maxW && str.length > 3) str = str.slice(0, -2); if (str !== s) str += '…';
    const w = c.measureText(str).width + 14; c.fillStyle = bg; A.rr(c, x - w / 2, y - size, w, size + 9, 6); c.fill(); text(str, x, y + 1, size, col);
  }

  /* ================= MUSÉE ================= */
  const THEME_STYLE = {
    fossiles: { wall: '#d8c8a8', wall2: '#c4b18c', floor: '#cdbb98', floor2: '#bfa985', trim: '#8a6a48' },
    historique: { wall: '#b98b5e', wall2: '#a57a50', floor: '#8a6346', floor2: '#7a573c', trim: '#5a3b22' },
    art: { wall: '#a8473a', wall2: '#953d31', floor: '#e8e1d4', floor2: '#d7cfc0', trim: '#d9b34a' },
    technologie: { wall: '#7f97ad', wall2: '#6f879d', floor: '#d9dee3', floor2: '#c6ccd2', trim: '#3e4f60' },
    curiosites: { wall: '#6d4f8a', wall2: '#5e4378', floor: '#3e3550', floor2: '#352d45', trim: '#d9b34a' },
    speciales: { wall: '#2f6f62', wall2: '#285f54', floor: '#e6d8b8', floor2: '#d6c6a2', trim: '#d9b34a' },
  };
  const Museum = {
    ROOM_W: 980,
    slotPos(ri, si, n) {
      const back = Math.ceil(n / 2), front = n - back; const x0 = ri * this.ROOM_W;
      if (si < back) { const sp = (this.ROOM_W - 200) / back; return { x: x0 + 100 + sp * (si + 0.5), y: 360, back: true }; }
      const j = si - back; const sp = (this.ROOM_W - 260) / Math.max(1, front); return { x: x0 + 130 + sp * (j + 0.5), y: 520, back: false };
    },
    draw(dt) {
      const M = G.Sys.Museum, rooms = M.rooms();
      for (let ri = 0; ri < 3; ri++) {
        const x0 = ri * this.ROOM_W, W = this.ROOM_W; const r = rooms[ri];
        if (!r) { // salle verrouillée
          c.fillStyle = '#3a332d'; c.fillRect(x0, 0, W, 600); c.fillStyle = '#2b2622'; c.fillRect(x0, 300, W, 300);
          text('🔒', x0 + W / 2, 260, 60); text(M.ROOM_NAMES[ri], x0 + W / 2, 320, 22, '#f2e6cc', 'center', '800');
          text('Débloquée au niveau ' + (ri + 1) + ' du musée (Gestion › Bâtiments)', x0 + W / 2, 350, 15, '#cdbb98', 'center', '600');

        }
        const st = THEME_STYLE[r.theme] || THEME_STYLE.fossiles;
        // mur
        c.fillStyle = st.wall; c.fillRect(x0, 0, W, 300);
        c.fillStyle = st.wall2; for (let x = x0; x < x0 + W; x += 60) c.fillRect(x, 0, 30, 300);
        c.fillStyle = 'rgba(0,0,0,.08)'; c.fillRect(x0, 0, W, 40);
        c.fillStyle = st.trim; c.fillRect(x0, 225, W, 8); c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(x0, 233, W, 67);
        c.fillStyle = st.trim; c.fillRect(x0, 292, W, 10);
        // sol en damier
        for (let y = 302; y < 600; y += 40) for (let x = x0; x < x0 + W; x += 40) { c.fillStyle = ((x - x0) / 40 + (y - 302) / 40) % 2 ? st.floor : st.floor2; c.fillRect(x, y, 40, 40); }
        const g = c.createLinearGradient(0, 300, 0, 600); g.addColorStop(0, 'rgba(0,0,0,.18)'); g.addColorStop(0.3, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(x0, 300, W, 300);
        // tapis central
        c.fillStyle = 'rgba(160,40,40,.55)'; c.fillRect(x0 + 60, 430, W - 120, 40); c.strokeStyle = 'rgba(217,179,74,.8)'; c.lineWidth = 2; c.strokeRect(x0 + 66, 434, W - 132, 32);
        // lustres
        for (const lx of [x0 + W * 0.25, x0 + W * 0.75]) { c.strokeStyle = '#8a7a5a'; c.lineWidth = 2; c.beginPath(); c.moveTo(lx, 0); c.lineTo(lx, 30); c.stroke(); A.ell(c, lx, 36, 26, 8, '#d9b34a'); for (let k = -2; k <= 2; k++) A.circ(c, lx + k * 10, 44, 3.5, '#fff6c8'); const gl = c.createRadialGradient(lx, 60, 5, lx, 60, 200); gl.addColorStop(0, 'rgba(255,240,190,.25)'); gl.addColorStop(1, 'rgba(255,240,190,0)'); c.fillStyle = gl; c.fillRect(lx - 200, 0, 400, 300); }
        // décoration murale selon le thème
        if (r.theme === 'art') for (let k = 0; k < 4; k++) { const fx = x0 + 120 + k * 220; c.fillStyle = '#d9b34a'; c.fillRect(fx - 4, 120, 88, 70); c.fillStyle = ['#7fb0d8', '#9cc45a', '#e6a35a', '#c4a0d8'][k]; c.fillRect(fx + 4, 128, 72, 54); }
        else for (let k = 0; k < 3; k++) { const bx = x0 + 180 + k * 310; c.fillStyle = st.trim; c.fillRect(bx, 80, 50, 110); A.poly(c, [bx, 190, bx + 25, 206, bx + 50, 190], st.trim); text(G.D.categories[r.theme].icon, bx + 25, 145, 26); }
        // arche vers la salle suivante
        if (ri > 0) { c.fillStyle = '#efe6d2'; c.fillRect(x0 - 18, 60, 36, 240); c.fillStyle = 'rgba(0,0,0,.15)'; c.fillRect(x0 + 6, 60, 12, 240); }
        // plaque de salle (toucher pour changer le thème)
        const sc = M.roomScore(ri);
        c.fillStyle = '#3a2f26'; A.rr(c, x0 + W / 2 - 230, 50, 460, 62, 12); c.fill(); c.strokeStyle = '#d9b34a'; c.lineWidth = 3; A.rr(c, x0 + W / 2 - 226, 54, 452, 54, 10); c.stroke();
        text(M.ROOM_NAMES[ri], x0 + W / 2, 78, 20, '#f6e6b8', 'center', '800');
        text(G.D.categories[r.theme].icon + ' ' + G.D.categories[r.theme].name + ' · Score ' + sc.score + ' · Cohérence ' + Math.round(sc.coherence * 100) + ' % · ✏️ changer', x0 + W / 2, 100, 13, '#e9dcbc', 'center', '600');
        hit(x0 + W / 2 - 230, 50, 460, 62, () => chooseTheme(ri));
        // vitrines (arrière puis avant pour la profondeur)
        const n = r.slots.length; const order = r.slots.map((_, i) => i).sort((a, b) => this.slotPos(ri, a, n).y - this.slotPos(ri, b, n).y);
        const ws = this.walkersFor(ri, dt);
        const items = order.map(si => ({ y: this.slotPos(ri, si, n).y, f: () => this.vitrine(ri, si, n) }));

      if (tro.length) { c.fillStyle = '#5a3b22'; c.fillRect(20, 250, 26 * tro.length + 20, 40); tro.forEach((id, k) => text('🏆', 40 + k * 26, 280, 22)); }
      const guide = G.Sys.Chars.employeeOf('museum');
      if (guide) { A.drawChar(c, G.D.characters[guide].look, 70, 560, 2, t, false, 1); plate('Guide : ' + G.D.characters[guide].name.split(' ')[0], 70, 584, 160); }
    },
    vitrine(ri, si, n) {
      const p = this.slotPos(ri, si, n); const id = G.Sys.Museum.rooms()[ri].slots[si]; const x = p.x, y = p.y;
      const theme = G.Sys.Museum.rooms()[ri].theme;
      A.shadow(c, x, y + 2, 46, 10, 0.25);
      if (p.back) {
        c.fillStyle = '#f2ece0'; c.fillRect(x - 40, y - 54, 80, 54); c.fillStyle = 'rgba(0,0,0,.1)'; c.fillRect(x + 20, y - 54, 20, 54); c.fillStyle = '#d9cfbd'; c.fillRect(x - 44, y - 58, 88, 8);

        c.fillStyle = 'rgba(200,230,255,.18)'; c.fillRect(x - 40, y - 150, 80, 92); c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.strokeRect(x - 40, y - 150, 80, 92);
        c.strokeStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.moveTo(x - 30, y - 140); c.lineTo(x - 14, y - 124); c.stroke();

      } else {
        c.fillStyle = '#efe6d2'; c.fillRect(x - 34, y - 70, 68, 70); c.fillStyle = 'rgba(0,0,0,.1)'; c.fillRect(x + 14, y - 70, 20, 70); c.fillStyle = '#d9cfbd'; c.fillRect(x - 40, y - 76, 80, 9); c.fillRect(x - 40, y - 6, 80, 6);
        if (id) { const big = G.D.items[id].rarity === 'legendaire' ? 1.35 : 1; const s = 86 * big; const im = iconImg('item', id); if (im.complete) c.drawImage(im, x - s / 2, y - 76 - s + 8 + Math.sin(t * 1.5 + si) * 1.5, s, s); }
        // cordon
        c.strokeStyle = '#a8473a'; c.lineWidth = 3; c.beginPath(); c.moveTo(x - 50, y + 4); c.quadraticCurveTo(x, y + 18, x + 50, y + 4); c.stroke(); for (const px of [x - 50, x + 50]) { c.fillStyle = '#d9b34a'; c.fillRect(px - 2, y - 22, 4, 26); A.circ(c, px, y - 22, 4, '#d9b34a'); }
      }
      if (id) { const it = G.D.items[id]; plate(it.name, x, y + (p.back ? 22 : 34), 150, G.D.items[id].cat === theme ? 'rgba(220,240,215,.96)' : 'rgba(255,248,236,.95)'); c.fillStyle = G.D.rarities[it.rarity].color; A.circ(c, x + 44, y - (p.back ? 150 : 76), 6, G.D.rarities[it.rarity].color); }
      else { c.setLineDash([6, 5]); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2; const yy = p.back ? y - 150 : y - 150; c.strokeRect(x - 38, yy, 76, p.back ? 92 : 70); c.setLineDash([]); text('＋', x, yy + (p.back ? 54 : 46), 26, 'rgba(255,255,255,.95)'); plate('Vitrine libre', x, y + (p.back ? 22 : 34), 150, 'rgba(255,255,255,.6)', '#6e6050'); }
      hit(x - 46, y - 160, 92, 196, () => slotClick(ri, si));
    },
    walkersFor(ri, dt) {
      // visiteurs présents au musée dans la simulation de l'île
      const inside = G.Sys.Sim.agents.filter(a => a.hidden && a.act === 'museum');
      const n = G.Sys.Museum.rooms()[ri].slots.length; const out = [];
      inside.forEach((a, i) => {

        if (!w) w = walkers[a.id] = { x: ri * this.ROOM_W + 40, y: 470 + U.rand(-10, 30), tx: 0, ty: 0, timer: 0, look: a.look, t: Math.random() * 5, facing: 1, moving: false };
        w.t += dt; w.timer -= dt;
        if (w.timer <= 0) { const si = U.randi(0, n - 1); const p = this.slotPos(ri, si, n); w.tx = p.x + U.rand(-30, 30); w.ty = p.back ? 420 + U.rand(0, 20) : 575; w.timer = U.rand(4, 7); const id = G.Sys.Museum.rooms()[ri].slots[si]; w.bubble = null; w.pendingBubble = id ? U.pick(['Magnifique !', 'Oh, ' + G.D.items[id].name.toLowerCase() + ' !', 'Fascinant…', 'Regarde ça !']) : null; }
        const dx = w.tx - w.x, dy = w.ty - w.y, d = Math.hypot(dx, dy);
        if (d > 2) { w.x += dx / d * 70 * dt; w.y += dy / d * 70 * dt; w.facing = dx > 0 ? 1 : -1; w.moving = true; } else { w.moving = false; if (w.pendingBubble && Math.random() < 0.02) { w.bubble = w.pendingBubble; w.pendingBubble = null; } }
        out.push(w);
      });
      return out;

  };

      const stars = Math.round(ev.total * 5);
      const row = (l, v) => '<div class="row small"><span style="width:96px">' + l + '</span><div class="grow"><div class="bar ' + (v > 0.7 ? 'good' : v > 0.4 ? 'warn' : 'bad') + '"><i style="width:' + Math.round(v * 100) + '%"></i></div></div><b style="width:40px;text-align:right">' + Math.round(v * 100) + '%</b></div>';
      toastEl.innerHTML = '<div class="stars">' + '★'.repeat(stars) + '☆'.repeat(5 - stars) + '</div><b>' + E(o.name) + ' · ' + Math.round(ev.total * 100) + ' %</b>' + row('Recette', ev.recipeOK) + row('Ingrédients', ev.ing) + row('Préparation', ev.prep) + row('Garnitures', ev.garn) + row('Rapidité', ev.speed) + '<div class="small">💰 +' + res.pay + ' 🪙' + (res.tip ? ' (pourboire ' + res.tip + ')' : '') + '</div><div class="muted small">Touchez pour continuer</div>';
      toastEl.classList.remove('hidden'); toastEl.onclick = () => toastEl.classList.add('hidden'); clearTimeout(toastEl._t); toastEl._t = setTimeout(() => toastEl.classList.add('hidden'), 4500);
      lastRender = ''; lastStation = ''; renderUI(); info();
    }
    return { open, close, frame };
  })();

  function init() {
    cv = document.getElementById('scCanvas'); c = cv.getContext('2d'); bindInput();
    $('#scBack').onclick = () => close();
    $('#scManage').onclick = () => { const k = cur; close(); G.UI.openTab('gestion', k); };
    U.on('museum', info); U.on('zoo', info); U.on('aquarium', info);
    window.addEventListener('keydown', e => { if (e.key === 'Escape' && cur && !G.UI.modalOpen()) close(); });
  }
  return { init, open, close, isOpen, current: () => cur };
})();

</script>
<script>/* js/main.js */
/* ARCHIPEL — démarrage, boucle économique, sauvegarde automatique */

G.VERSION = '0.6.0';

G.Main = (() => {
  function welcome(force) {
    if (G.state.tutorial.welcome && !force) return;
    G.state.tutorial.welcome = true; G.State.save(true);
    G.UI.modal({
      title: '🏝️ Bienvenue dans l\'Archipel !', wide: true,
      html: '<div class="dialog"><img src="' + G.Art.icon('char', 'odile', 96) + '" alt=""><div class="speech">Bonjour, nouvelle direction ! Je suis <b>Odile</b>, votre secrétaire. Notre petite île possède un musée, un zoo, un aquarium et un bar-café… mais ils sont presque vides. À vous de les faire vivre !</div></div>'
        + '<div class="dialog" style="margin-top:10px"><img src="' + G.Art.icon('char', 'merou', 96) + '" alt=""><div class="speech">Et moi, c\'est le <b>Capitaine Mérou</b>. Mon Bigorneau vous emmène explorer les îles voisines. Commençons par l\'<b>Île Préhistorique</b> !</div></div>'
        + '<div class="card small"><b>Pour bien démarrer :</b><ol style="margin:6px 0;padding-left:20px"><li><b>Explorer</b> › Île Préhistorique › Embarquer. Déplacez-vous au clavier (ZQSD / flèches) ou en touchant l\'écran.</li><li>Parlez aux habitants (<b>!</b> = mission), fouillez, pêchez, observez les animaux, récoltez.</li><li>De retour, <b>touchez un bâtiment</b> pour y entrer : vitrines du musée, enclos du zoo, bassins de l\'aquarium et service au bar-café.</li><li>Les visiteurs arrivent par bateau et se promènent seuls. Touchez-les pour voir leur fiche.</li><li>Chaque lundi, une nouvelle <b>Gazette</b> paraît avec une mission et un cadeau.</li><li>🎉 <b>Bonus d\'inauguration</b> : vos recettes sont multipliées par 1,5 pendant les 45 premières minutes de jeu !</li></ol>La partie est sauvegardée automatiquement (export possible dans ⚙️).</div>',
      buttons: [{ label: 'C\'est parti !', primary: true }],
    });
  }

  function offlineSummary(r) {
    if (!r || (!r.coins && !r.visitors)) return;
    G.UI.modal({ title: '🌅 Pendant votre absence…', html: '<p>Votre île a continué de vivre pendant <b>' + (r.minutes >= 60 ? Math.floor(r.minutes / 60) + ' h ' + (r.minutes % 60) + ' min' : r.minutes + ' min') + '</b>' + (r.capped ? ' (gains plafonnés à 6 h)' : '') + '.</p><div class="stats"><div class="stat"><b>' + G.U.fmt(r.visitors) + '</b><span>visiteurs</span></div><div class="stat"><b>+' + G.U.fmt(r.coins) + ' 🪙</b><span>recettes</span></div></div><p class="muted small">Les animaux ont été nourris par les bénévoles et l\'eau des bassins n\'est pas descendue sous 50 %.</p>', buttons: [{ label: 'Merci !', primary: true }] });
    G.Game.log('Absence : ' + r.visitors + ' visiteurs, +' + r.coins + ' pièces.', '🌅');
  }

  function boot() {
    const status = G.State.load();
    G.Game.ensureStructure();
    G.Sys.Gazette.ensureBase();
    const off = status === 'loaded' ? G.Game.offlineCatchUp() : null;
    G.UI.init();
    G.Home.init(document.getElementById('home'));
    G.Explore.init(document.getElementById('explore'));
    G.Home.start();
    G.UI.hud();
    G.Sys.Gazette.checkNewWeek();
    // cycle économique (1 min) + sauvegarde régulière
    setInterval(() => { G.state.playMs += 60000; G.Game.cycle(); }, 60000);
    setInterval(() => G.State.save(true), 20000);
    let hiddenAt = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenAt = Date.now(); G.State.save(true); }
      else if (hiddenAt && Date.now() - hiddenAt > 2 * 60000) { G.state.lastSeen = hiddenAt; offlineSummary(G.Game.offlineCatchUp()); G.State.save(true); G.UI.hud(); }
    });
    window.addEventListener('pagehide', () => G.State.save(true));
    window.addEventListener('beforeunload', () => G.State.save(true));
    if (status === 'new') G.Avatar.open(true, () => welcome()); else { offlineSummary(off); if (!G.state.avatar.name) setTimeout(() => G.UI.toast('Nouveau : personnalisez votre personnage dans ⚙️ Paramètres !', '🧑'), 2500); }
    G.Audio.setScene('home');
    G.PWA.register();
    G.U.on('pwa', () => { if (!G.state.tutorial.pwaHint && !G.PWA.standalone()) { G.state.tutorial.pwaHint = true; G.UI.modal({ title: '📲 Installer Archipel ?', html: '<p>Ajoutez Archipel à votre écran d\'accueil : il s\'ouvrira comme une vraie application, en plein écran, et fonctionnera même sans connexion.</p>', buttons: [{ label: 'Plus tard' }, { label: 'Installer', primary: true, onClick: () => G.PWA.install() }] }); } });
    G.State.save(true);
  }

  return { boot, welcome };
})();

window.addEventListener('DOMContentLoaded', () => {
  try { G.Main.boot(); }
  catch (e) {
    console.error(e);
    document.body.innerHTML = '<div style="padding:20px;font-family:sans-serif;background:#fff8ec;min-height:100vh"><h2>Oups, le jeu n\'a pas pu démarrer.</h2><pre style="white-space:pre-wrap">' + G.U.esc(e.stack || e) + '</pre><p>Vous pouvez essayer de recharger la page. Si le problème persiste, une sauvegarde corrompue peut en être la cause.</p><button onclick="localStorage.removeItem(\'archipel_save\');location.reload()">Effacer la sauvegarde et recommencer</button></div>';
  }
});

</script>
